<style>
  :root{
    --bg:#2a3022; --ink:#2a2f24; --paper:#f4efe2; --paper2:#e8e1cd; --olive:#56673a; --olive-d:#3c4a28;
    --accent:#c98a2e; --muted:#7a7a66; --line:#d6cdb4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .zoombox{position:fixed;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoombox button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:22px;font-weight:700;line-height:1;padding:0;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.22)}
  .zoombox button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .zoombox #zoomFit{font-size:12px}
  button{font:inherit;cursor:pointer}

  /* HUD */
  .hud{position:fixed;left:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
  .chip{background:rgba(250,244,228,.94);border:1px solid #d9c9a0;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;box-shadow:0 2px 0 #d9c9a0,0 5px 12px rgba(40,30,10,.22);color:var(--ink)}
  button.chip{pointer-events:auto}
  button.chip:hover{background:#fff6dc}
  .plist{position:fixed;left:12px;top:56px;width:min(260px,80vw);max-height:min(60vh,420px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line),0 8px 20px rgba(0,0,0,.28);padding:8px 6px;z-index:6;display:none}
  .plist.show{display:block}
  .plist h4{margin:2px 8px 6px;font-size:12px;color:var(--muted);font-weight:600}
  .plist div.row{padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center}
  .plist div.row.me{background:#e8efd4}
  .plist div.row i{font-style:normal;font-size:11px;color:var(--muted);font-weight:400;margin-left:auto}
  .chip b,.start h1,.card header h2,.card .body h3{font-family:"Jua","Pretendard","Malgun Gothic",sans-serif;font-weight:400}
  .chip b{font-size:15px}
  .chip b{color:var(--olive-d)}
  .bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  .bar button,.enter{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.22);color:var(--ink)}
  .bar button:active,.enter:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .bar{flex-wrap:wrap;justify-content:center;width:min(760px,96vw)}
  .chatrow{display:flex;gap:6px;flex:1 1 240px;max-width:340px}
  #chat{flex:1;min-width:0;border-radius:14px;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.22)}
  #log{position:fixed;left:12px;bottom:84px;width:min(300px,70vw);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:4}
  #log div{background:rgba(30,34,24,.72);color:#fff;border-radius:10px;padding:5px 10px;font-size:12.5px;line-height:1.4;word-break:break-all}
  #log div b{color:#ffd37a;margin-right:4px}
  #log div.me b{color:#bfe39a}
  .enter{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--accent);color:#fff;border-color:#b86a1c;box-shadow:0 3px 0 #b86a1c,0 8px 18px rgba(0,0,0,.3);display:none;z-index:6;animation:pop .25s ease}
  .enter.show{display:block}
  @keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  .hint{position:fixed;right:12px;top:12px;font-size:12px;color:#e8e1cd;opacity:.85;text-align:right;line-height:1.5;pointer-events:none}

  /* overlay / modal */
  .overlay{position:fixed;inset:0;background:rgba(20,24,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
  .overlay.show{display:flex}
  .card{background:var(--paper);border-radius:20px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .22s ease}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .card header{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;position:sticky;top:0;background:var(--paper);z-index:1}
  .card header .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
  .card header h2{margin:0;font-size:20px}
  .card header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .x{margin-left:auto;background:none;border:0;font-size:24px;color:var(--muted);padding:4px 8px}
  .body{padding:16px 22px 22px}
  .body h3{font-size:13px;letter-spacing:.04em;color:var(--olive-d);margin:18px 0 8px;text-transform:none}
  .body h3:first-child{margin-top:0}
  .tip{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
  .tip i{font-style:normal;flex:none}
  .story{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .story .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .story .tag{background:var(--paper2);border-radius:999px;padding:1px 8px;font-size:11px}
  .story h4{margin:0 0 4px;font-size:15px}
  .story p{margin:0;font-size:14px;line-height:1.6;color:#3d4132}
  .story.example{border-style:dashed;border-color:var(--accent);background:#fff7ec}
  .story.example .tag{background:var(--accent);color:#fff}
  .story.hot{border-color:#e0572f;background:#fff4ef}
  .story .hotTag{background:#e0572f;color:#fff}
  .likeRow{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .cmtToggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink)}
  .cmtToggle:hover{border-color:var(--olive)}
  .cmts{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .cmt{font-size:13.5px;line-height:1.5;padding:4px 0;word-break:break-all}
  .cmt b{color:var(--olive-d);margin-right:4px}
  .cmt span{color:var(--muted);font-size:11.5px;margin-left:4px}
  .cmtMore{font-size:12px;color:var(--muted);padding:2px 0 4px}
  .cmtForm{display:flex;gap:6px;margin-top:6px}
  .cmtForm input{flex:1;min-width:0;padding:8px 10px;font-size:13.5px}
  .cmtGo{background:var(--olive);color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:700;font-size:13px}
  .rep{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);margin-left:auto}
  .rep:hover:not([disabled]){border-color:#e0572f;color:#b23a18}
  .rep[disabled]{cursor:default;opacity:.7}
  .cmt .rep{padding:1px 7px;font-size:11px;margin-left:6px}
  .rules{margin:12px 0 4px;padding:10px 12px;background:#fff7ec;border:1px dashed var(--accent);border-radius:12px;font-size:12.5px;line-height:1.55;color:#5a4a30}
  .rules ul{margin:4px 0 0;padding-left:18px}
  .like{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink)}
  .like:hover:not([disabled]){border-color:#e0572f}
  .like.on{background:#fde7df;border-color:#e0572f;color:#b23a18;cursor:default}
  textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px}
  .primary{background:var(--olive);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
  .primary:hover{background:var(--olive-d)}
  .note{font-size:12px;color:var(--muted);margin-top:6px}

  /* start screen */
  .start .card{width:min(460px,100%)}
  .start h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
  .start .sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.55}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--olive-d);margin-bottom:6px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
  .sw.on{border-color:var(--ink)}
  .picker{position:relative;height:132px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  .pick-hl{position:absolute;left:8px;right:8px;top:44px;height:44px;border-radius:10px;background:rgba(93,107,58,.14);border:1px solid var(--olive);pointer-events:none}
  .pick-list{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:44px 0;scrollbar-width:none;overscroll-behavior:contain}
  .pick-list::-webkit-scrollbar{display:none}
  .pick-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:17px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
  .pick-item.on{color:var(--ink);font-size:20px}
  .preview{display:grid;place-items:center;background:#a9c27a;border-radius:14px;height:110px;margin-bottom:14px}
  .go{width:100%;padding:13px;font-size:16px;margin-top:4px}
  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  .emo{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;display:none;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 3px 0 var(--line),0 8px 18px rgba(0,0,0,.28);z-index:7}
  .emo.show{display:flex}
  .emo button{background:none;border:0;font-size:26px;padding:2px 6px;border-radius:10px;line-height:1.2}
  .emo button:active{background:var(--paper2)}
  @media (max-width:560px){
    .hint{display:none}.bar button{padding:9px 11px;font-size:13px}
    .enter{bottom:150px}.emo{bottom:150px}#log{bottom:150px}
    .card header{padding:16px 16px 12px}.body{padding:14px 16px 18px}
  }
  @media (max-height:780px){.preview{height:84px}.start .sub{font-size:13px;margin-bottom:10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="chip">🪖➡️🙂 <b>복귀마을</b></div>
  <div class="chip" id="dday" style="display:none"></div>
  <button class="chip" id="online" title="접속 중인 사람 보기">마을 주민 <b>0</b>명</button>
  <button class="chip" id="todBtn" title="하루 시간대 바꾸기">🕒 자동</button>
</div>
<div class="hint">방향키 / WASD 이동 · 바닥 클릭·탭으로 이동<br>건물 앞·벤치·그네 앞에서 E 또는 버튼<br>Enter로 채팅 · 1~5 감정 표현 (😄 👏 💪 😭 🫡)</div>

<div class="zoombox" id="zoombox">
  <button id="zoomIn" aria-label="확대">＋</button>
  <button id="zoomOut" aria-label="축소">－</button>
  <button id="zoomFit" aria-label="기본 크기" title="기본 크기">기본</button>
</div>
<div class="plist" id="plist"></div>
<button class="enter" id="enterBtn">입장</button>
<div id="log"></div>
<div class="bar">
  <div class="chatrow"><input id="chat" type="text" maxlength="40" placeholder="Enter 눌러 채팅" autocomplete="off"><button id="chatGo">💬</button></div>
  <button id="saluteBtn">🫡 경례</button>
  <button id="emoBtn" title="감정 표현">😄 표정</button>
  <button id="pledgeBtn">🏮 오늘의 다짐</button>
  <button id="helpBtn">❓ 도움말</button>
</div>
<div class="emo" id="emo"><button data-i="0">😄</button><button data-i="1">👏</button><button data-i="2">💪</button><button data-i="3">😭</button><button data-i="4">🫡</button></div>
<div class="toast" id="toast"></div>

<!-- start -->
<div class="overlay show start" id="start">
  <div class="card"><div class="body" style="padding:24px">
    <h1>복귀마을에 오신 걸<br>환영합니다 🫡</h1>
    <p class="sub">막 전역해서 뭘 해야 할지 막막한 사람들이 모이는 마을이에요. 걸어 다니며 선배들의 경험을 구경하고, 내 다짐도 걸어두세요.</p>
    <div class="preview"><canvas id="pv" width="160" height="110" style="width:160px;height:110px"></canvas></div>
    <div class="field"><label>마을에서 쓸 이름</label><input type="text" id="nm" maxlength="8" placeholder="예) 복학생J"></div>
    <div class="field"><label>옷 색</label><div class="swatches" id="swUni"></div></div>
    <div class="field"><label>모자 색</label><div class="swatches" id="swCap"></div></div>
    <div class="field"><label>내 경례 구호 <span style="font-weight:400;color:var(--muted)">(🫡 경례 버튼을 누르면 말풍선으로 나와요)</span></label><div class="picker"><div class="pick-hl"></div><div class="pick-list" id="chips"></div></div></div>
    <div class="field"><label>전역일<span style="font-weight:400;color:var(--muted)">(선택 · 전역 후 며칠째인지 표시돼요)</span></label><input type="date" id="dis"></div>
    <button class="primary go" id="go">마을로 들어가기</button>
  </div></div>
</div>

<!-- modal -->
<div class="overlay" id="modal"><div class="card" id="mcard"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- world ---------- */
const W = 1600, H = 1000;
const PLAZA = { x:800, y:520, rx:220, ry:120 };
const POND = { x:250, y:610, rx:125, ry:80 };
const CAMP = { x:1340, y:570 };
const SIGNPOST = { x:590, y:405 };
const WELCOME = { x:800, y:638 };   // 광장 한가운데 환영 표지판
const PLAY = { x:1250, y:445 };     // 놀이터(그네)
const SWINGS = [ { id:'swing0', ax:PLAY.x-36, ay:PLAY.y-70, L:56, ph:0 }, { id:'swing1', ax:PLAY.x+36, ay:PLAY.y-70, L:56, ph:1.7 } ];
/* 위 세 건물은 윗길(y=330)에, 아래 세 건물은 아랫길(y=900)에 문이 닿아요. route는 광장에서 문 앞까지 가는 길목(주민이 따라 걸어요) */
const BUILDINGS = [
  { id:'job', theme:'office', name:'취업관', emoji:'💼', x:130, y:110, w:240, h:150, wall:'#d9cfa3', roof:'#56673a', trim:'#3c4a28',
    route:[[520,430],[520,330],[250,330]],
    desc:'공채·수시채용, 이력서, 면접 준비',
    example:'이력서에 군 경력을 어떻게 써야 할지 막막해요. 직무와 연결해서 써 보신 분, 방법 좀 알려 주세요.' },
  { id:'cert', theme:'library', name:'자격증 도서관', emoji:'📚', x:680, y:110, w:240, h:150, wall:'#d6c697', roof:'#6b6a3a', trim:'#47461f',
    route:[[930,470],[800,400],[800,330]],
    desc:'자격증·어학·공시 준비 스터디',
    example:'전역하고 첫 자격증으로 뭘 준비하셨나요? 목표 직무가 아직 없을 때 어떤 기준으로 골랐는지 궁금해요.' },
  { id:'soon', theme:'calendar', name:'전역 준비관', emoji:'📅', x:1230, y:110, w:240, h:150, wall:'#dccf9f', roof:'#44624a', trim:'#2e4533',
    route:[[1080,430],[1080,330],[1350,330]],
    cta:'전역 준비 이야기 남기기', ph:'전역까지 남은 기간, 고민, 준비 중인 것을 남겨 보세요',
    desc:'곧 전역하는 사람들을 위한 준비 공간',
    example:'전역 D-30인데 뭘 준비해야 할지 모르겠어요. 먼저 전역하신 분들은 이 시기에 뭘 하셨나요?' },
  { id:'trip', theme:'travel', name:'여행사', emoji:'🧳', x:130, y:680, w:240, h:150, wall:'#e0d3a8', roof:'#4a5f6b', trim:'#33444e',
    route:[[520,600],[520,900],[250,900]],
    desc:'여행, 워킹홀리데이, 해외 경험',
    example:'전역하고 첫 여행을 다녀오신 분 계신가요? 예산은 어떻게 잡으셨는지 궁금해요.' },
  { id:'rest', theme:'cafe', name:'쉼터', emoji:'🍵', x:680, y:680, w:240, h:150, wall:'#e2d6a8', roof:'#7a7a3e', trim:'#55551f',
    route:[[520,600],[520,900],[800,900]],
    desc:'막막할 때, 마음 이야기',
    example:'전역하고 나니 괜히 불안하고 막막한 날이 많아요. 여러분은 그런 날 어떻게 보내세요?' },
  { id:'story', theme:'cabin', name:'군대 썰방', emoji:'🔥', x:1230, y:680, w:240, h:150, wall:'#b59a66', roof:'#6a4d33', trim:'#46321f',

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(20261104);
function isFree(x, y, pad=0){
  if(x<pad||y<pad||x>W-pad||y>H-pad) return false;
  for(const r of ROADS) if(x>r.x-pad && x<r.x+r.w+pad && y>r.y-pad && y<r.y+r.h+pad) return false;
  for(const b of BUILDINGS) if(x>b.x-pad-30 && x<b.x+b.w+pad+30 && y>b.y-pad-60 && y<b.y+b.h+pad+20) return false;
  if(((x-PLAZA.x)/(PLAZA.rx+pad))**2 + ((y-PLAZA.y)/(PLAZA.ry+pad))**2 < 1) return false;
  if(((x-POND.x)/(POND.rx+pad))**2 + ((y-POND.y)/(POND.ry+pad))**2 < 1) return false;
  if(Math.hypot(x-CAMP.x, y-CAMP.y) < 95+pad) return false;
  if(Math.hypot(x-SIGNPOST.x, y-SIGNPOST.y) < 40+pad) return false;
  if(((x-PLAY.x)/(140+pad))**2 + ((y-PLAY.y-10)/(92+pad))**2 < 1) return false;
  if(Math.hypot(x-1104, y-524) < 44+pad) return false;
  for(const q of TENTS) if(Math.hypot(x-q.x, y-q.y) < 62*q.s+pad) return false;
  if(Math.abs(x-TRUCK.x) < 92+pad && Math.abs(y-TRUCK.y) < 52+pad) return false;
  if(Math.hypot(x-GATE.x, y-GATE.y) < 90+pad) return false;
  if(Math.hypot(x-FIT_SIGN.x, y-FIT_SIGN.y) < 36+pad) return false;
  return true;
}

function connect(){
  if(!/^https?:$/.test(location.protocol)) return;
  let ws; try{ ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host); }catch(e){ return; }
  const old = net.ws; net.ws = ws;

  ws.onopen = () => ws.send(JSON.stringify({ t:'join', uid:myUid(), name:me.name, uni:me.uni, cap:me.cap, x:me.x, y:me.y }));
  ws.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(m.t==='init'){ net.on=true; net.id=m.id; net.players.clear(); m.players.forEach(addRemote); net.pledges=m.pledges||[]; net.posts=m.posts||{}; toast('🌐 실시간으로 연결됐어요'); }

    else if(m.t==='leave') net.players.delete(m.id);
    else if(m.t==='move'){ const r=net.players.get(m.id); if(r){ r.tx=m.x; r.ty=m.y; r.dir=m.dir; r.act=null; } }
    else if(m.t==='act'){ const r=net.players.get(m.id); if(r){ r.act=m.a||null; r.x=r.tx=m.x; r.y=r.ty=m.y; r.dir=m.dir; } }
    else if(m.t==='fx'){ if(m.k==='fw') launchFw(m.x,m.y); }
    else if(m.t==='say'){ const r=net.players.get(m.id); if(r){ r.say=m.text; r.sayT=4.5; logChat(r.name, m.text); } }
    else if(m.t==='pledge') net.pledges.push(m.p);
    else if(m.t==='post'){ (net.posts[m.b] = net.posts[m.b]||[]).push(m.post); if(net.rerender) net.rerender(m.b); }
    else if(m.t==='comment'){ const p=(net.posts[m.b]||[]).find(x=>x.id===m.id); if(p){ (p.comments=p.comments||[]).push(m.c); p.cn=m.cn; if(net.rerender) net.rerender(m.b); } }

    else if(m.t==='del'){   /* 운영자가 지웠거나 신고가 모여 가려진 글·댓글 */

    else if(m.t==='delpledge'){ const i=net.pledges.findIndex(p=>p.text===m.text&&p.x===m.x&&p.y===m.y); if(i>=0) net.pledges.splice(i,1); }
    else if(m.t==='reported') toast('🚩 신고했어요. 여러 명이 신고하면 글이 가려지고 운영자가 확인해요');

    else if(m.t==='full') toast('마을이 가득 찼어요. 잠시 후 다시 시도해 주세요');
  };

  if(x>WELCOME.x-96 && x<WELCOME.x+96 && y>WELCOME.y-96 && y<WELCOME.y+6) return true;   // 환영 표지판(뒤로 들어가지 못하게)
  for(const l of LAMPS) if(Math.hypot(x-l[0],y-l[1])<7) return true;
  return false;
}
function move(p,dx,dy){
  if(!dx&&!dy) return false;
  const nx = p.x+dx, ny = p.y+dy; let m=false;
  if(!blocked(nx,p.y)){ p.x=nx; m=true; }
  if(!blocked(p.x,ny)){ p.y=ny; m=true; }
  if(dx) p.dir = dx>0?1:-1;
  if(m) p.step += 0.22;
  return m;
}
function say(p, text, ms=2600){ p.say=text; p.sayT=ms/1000; }

function update(dt){
  let dx=0, dy=0;
  if(keys.ArrowLeft||keys.a) dx-=1; if(keys.ArrowRight||keys.d) dx+=1;
  if(keys.ArrowUp||keys.w) dy-=1; if(keys.ArrowDown||keys.s) dy+=1;
  if((dx||dy||target) && me.act) stand();   // 움직이면 자리에서 일어나요
  if(dx||dy){ target=null; const l=Math.hypot(dx,dy); move(me, dx/l*me.speed*dt, dy/l*me.speed*dt); }
  else if(target){
    const tx=target.x-me.x, ty=target.y-me.y, d=Math.hypot(tx,ty);
    if(d<5) target=null; else if(!move(me, tx/d*me.speed*dt, ty/d*me.speed*dt)) target=null;
  }
  if(me.sayT>0) me.sayT-=dt;

  /* 다른 접속자: 서버에서 받은 위치로 부드럽게 따라가요 */
  net.players.forEach(r => {
    const rx=r.tx-r.x, ry=r.ty-r.y, d=Math.hypot(rx,ry), k=Math.min(1,dt*10);
    if(d>1){ r.x+=rx*k; r.y+=ry*k; r.step+=dt*11; }
    if(r.sayT>0) r.sayT-=dt;
  });
  net.t += dt;
  if(net.t>.1){ net.t=0; if(Math.abs(me.x-net.lx)>.5||Math.abs(me.y-net.ly)>.5){ net.lx=me.x; net.ly=me.y; net.send({t:'move',x:Math.round(me.x),y:Math.round(me.y),dir:me.dir}); } }

  (net.on ? [] : npcs).forEach(n => {
    if(n.sayT>0) n.sayT-=dt;
    if(n.act){ n.wait -= dt; if(n.wait<=0){ n.act = null; n.wait = .5; } return; }   // 벤치에 앉아 쉬는 중
    if(n.tx==null){
      if(n.q.length){ const p = n.q.shift(); n.tx = p[0]+(Math.random()-.5)*12; n.ty = p[1]+(Math.random()-.5)*8; }
      else {
        n.wait -= dt;
        if(n.wait<=0){
          if(n.at==='plaza' && Math.random()<.3){
            const s = SEATS[Math.floor(Math.random()*2)];   // 광장 벤치 두 곳
            n.q = [[s.x,s.y+4]]; n.sit = s; n.wait = 1;
          } else if(n.at==='plaza'){
            const b = BUILDINGS[Math.floor(Math.random()*BUILDINGS.length)];
            n.q = [...b.route, [b.door.x,b.door.y]]; n.at = b;
            if(Math.random()<.5) say(n, NPC_SAYS[Math.floor(Math.random()*NPC_SAYS.length)], 3200);
          } else {
            n.q = [...n.at.route].reverse(); n.q.push([PLAZA.x+(Math.random()-.5)*320, PLAZA.y+80+Math.random()*30]); n.at = 'plaza';
          }
          n.wait = 2+Math.random()*5;
        }
      }
    } else {
      const tx=n.tx-n.x, ty=n.ty-n.y, d=Math.hypot(tx,ty);
      if(d<8){ n.tx=null;
        if(n.sit && !n.q.length){ n.x = n.sit.x; n.y = n.sit.y; n.dir = n.sit.dir; n.act = 'sit'; n.wait = 4+Math.random()*6; n.sit = null; } }
      else if(!move(n, tx/d*n.speed*dt, ty/d*n.speed*dt)){
        /* 어딘가에 막혔으면 광장에서 다시 시작해요 */
        n.q = []; n.sit = null; n.tx = null; n.at = 'plaza'; n.wait = 1; n.x = PLAZA.x+(Math.random()-.5)*300; n.y = PLAZA.y+80+Math.random()*30;
      }
    }
  });

  stepAct(dt);
  nearB = null;
  for(const b of BUILDINGS){ if(Math.hypot(me.x-b.door.x, me.y-b.door.y)<52){ nearB=b; break; } }
  nearI = null;
  if(!nearB && !me.act){ let best = 1e9; for(const it of INTERACTS){ const d = Math.hypot(me.x-it.x, me.y-it.y); if(d<it.r && d/it.r<best){ best = d/it.r; nearI = it; } } }
  $('#enterBtn').classList.toggle('show', !!(nearB || nearI || me.act) && !inModal && started);
  if(nearB) $('#enterBtn').textContent = nearB.emoji+' '+nearB.name+' 입장';
  else if(me.act) $('#enterBtn').textContent = '🧍 일어나기';
  else if(nearI) $('#enterBtn').textContent = nearI.label;

  cam.x += (me.x-cam.x)*Math.min(1,dt*6); cam.y += (me.y-cam.y)*Math.min(1,dt*6);
  const onl = net.on ? '🟢 접속 중 <b>'+(net.players.size+1)+'</b>명'
    : '마을 주민 <b>'+(npcs.length+1)+'</b>명 <span style="font-weight:400;color:var(--muted)">(예시 · 오프라인)</span>';
  if(onl !== onlLast){ onlLast = onl; $('#online').innerHTML = onl; }
  if($('#plist').classList.contains('show')) renderPlist();
}

function todState(){
  if(todMode==='day') return { n:0, warm:0 };
  if(todMode==='dusk') return { n:.42, warm:1 };
  if(todMode==='night') return { n:1, warm:0 };
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  if(h<5) return { n:1, warm:0 };
  if(h<7){ const t = (h-5)/2; return { n:1-t, warm:Math.sin(t*Math.PI) }; }
  if(h<17) return { n:0, warm:0 };
  if(h<19){ const t = (h-17)/2; return { n:t*.5, warm:t }; }
  if(h<20.5){ const t = (h-19)/1.5; return { n:.5+.5*t, warm:1-t }; }
  return { n:1, warm:0 };
}

/* ---------- UI actions ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function salute(){
  const cry = '🫡 '+me.salute+'!'; say(me,cry,2500); net.send({t:'say',text:cry});
  npcs.forEach(n => { if(Math.hypot(n.x-me.x,n.y-me.y)<140) say(n, Math.random()<.5?'🫡 반가워요!':'나도 전역했어요 ㅎㅎ', 2400); });
}
/* ---------- 채팅: 머리 위 말풍선 + 최근 대화 ---------- */
function logChat(name, text, mine){
  const log = $('#log'), d = document.createElement('div');
  d.innerHTML = '<b>'+esc(name)+'</b> '+esc(text); if(mine) d.className='me';
  log.appendChild(d); while(log.children.length>6) log.firstChild.remove();
  setTimeout(()=>d.remove(), 20000);
}
function chatSend(){
  const inp = $('#chat'), v = inp.value.trim().slice(0,40); inp.value='';
  if(!v || !started) return;
  say(me, v, 4500); logChat(me.name, v, true); net.send({ t:'say', text:v });
  if(!net.on) logChat('안내', '지금은 오프라인이라 나에게만 보여요');
}
$('#chat').addEventListener('keydown', e => {
  e.stopPropagation();
  if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); chatSend(); e.target.blur(); }
  else if(e.key==='Escape'){ e.target.blur(); }
});
$('#chatGo').onclick = chatSend;
$('#saluteBtn').onclick = salute;
/* 폰에는 숫자 키가 없어서, 표정 버튼으로 감정 표현을 골라요 */
$('#emoBtn').onclick = e => { e.stopPropagation(); $('#emo').classList.toggle('show'); };
$('#emo').querySelectorAll('button').forEach(btn => { btn.onclick = () => { emote(Number(btn.dataset.i)); $('#emo').classList.remove('show'); }; });
document.addEventListener('pointerdown', e => { if(!e.target.closest('#emo') && !e.target.closest('#emoBtn')) $('#emo').classList.remove('show'); });
/* 시간대: 자동(내 컴퓨터 시계) → 낮 → 노을 → 밤 */
$('#todBtn').textContent = TOD_LABEL[todMode] || TOD_LABEL.auto;
$('#todBtn').onclick = () => {
  const order = ['auto','day','dusk','night']; todMode = order[(order.indexOf(todMode)+1) % order.length];
  store.set('hv_tod', todMode); $('#todBtn').textContent = TOD_LABEL[todMode];
  toast(todMode==='auto' ? '실제 시간에 맞춰 하루가 흘러가요' : TOD_LABEL[todMode]+'으로 바꿨어요');
};
$('#enterBtn').onclick = actKey;

  <header><div class="ico" style="background:var(--paper2)">❓</div><div><h2>이용 방법</h2><p>복귀마을 프로토타입</p></div><button class="x" onclick="window.__close()">×</button></header>
  <div class="body">

  </div>`);
$('#pledgeBtn').onclick = () => openCard(`
  <header><div class="ico" style="background:#fbe3cf">🏮</div><div><h2>오늘의 다짐</h2><p>광장에 내 등불을 걸어요</p></div><button class="x" onclick="window.__close()">×</button></header>

    <input type="text" id="pl" maxlength="30" placeholder="예) 오늘은 이력서 한 장 쓰기">

      if(net.on) net.send({ t:'pledge', text:v, x:Math.round(px), y:Math.round(py) });
      else { pledges.push({ name: me.name, text: v, x:px, y:py }); store.set('hv_pledges', pledges.slice(-30)); }
      closeModal(); toast('🏮 광장에 등불이 걸렸어요'); say(me,'🏮 '+v.slice(0,14),3000); net.send({t:'say',text:'🏮 '+v.slice(0,14)});

/* ---------- modal ---------- */
function openCard(html, after){ inModal=true; $('#mcard').innerHTML=html; $('#modal').classList.add('show'); after && after(); }
function closeModal(){ inModal=false; $('#modal').classList.remove('show'); }
window.__close = closeModal;
$('#modal').addEventListener('pointerdown', e => { if(e.target.id==='modal') closeModal(); });

/* 글 목록: 로컬 저장(오프라인) 또는 서버(온라인)를 같은 모양으로 다뤄요 */
const LIKED_KEY = 'hv_liked';
function getPosts(b){
  if(net.on) return net.posts[b.id] || [];
  const liked = store.get(LIKED_KEY, []);
  return store.get('hv_posts_'+b.id, []).map((p,i) => ({ id:p.id || 'l'+i, name:p.name, text:p.text, date:p.date, likes:p.likes||0, liked:liked.includes(b.id+':'+(p.id||'l'+i)), comments:p.comments||[], cn:(p.comments||[]).length }));
}
function addCommentLocal(b, id, text){
  const key = 'hv_posts_'+b.id, arr = store.get(key, []);
  const p = arr.find((x,i) => (x.id || 'l'+i) === id); if(!p) return;
  p.id = id; (p.comments = p.comments || []).push({ name: me.name, text, date: new Date().toLocaleDateString('ko-KR') });
  store.set(key, arr);
}
function likePost(b, id){
  if(net.on){ net.send({ t:'like', b:b.id, id }); return; }
  const key = 'hv_posts_'+b.id, arr = store.get(key, []), liked = store.get(LIKED_KEY, []), lk = b.id+':'+id;
  if(liked.includes(lk)) return;
  const p = arr.find((x,i) => (x.id || 'l'+i) === id); if(!p) return;
  p.id = id; p.likes = (p.likes||0) + 1; liked.push(lk);
  store.set(key, arr); store.set(LIKED_KEY, liked);
}
/* 인기글 2개: 좋아요가 1개 이상인 글 중 많은 순(같으면 먼저 쓴 글). 나머지는 최신순 */
function sortPosts(posts){
  const popular = posts.filter(p => p.likes > 0).sort((a,c) => c.likes - a.likes || posts.indexOf(a) - posts.indexOf(c)).slice(0,2);
  const rest = posts.filter(p => !popular.includes(p)).reverse();
  return { popular, rest };
}

function openBuilding(b){
  const open = new Set(), drafts = {};   // 펼친 댓글창, 쓰던 댓글(다시 그려도 유지)
  const reported = () => new Set(store.get('hv_reported', []));
  const repBtn = (id, cid) => { if(!net.on) return ''; const k = b.id+':'+id+(cid?':'+cid:''), done = reported().has(k);
    return `<button class="rep" data-id="${esc(id)}" ${cid?`data-cid="${esc(cid)}" `:''}${done?'disabled':''} title="부적절한 글이면 신고해 주세요">${done?'🚩 신고함':'🚩'}</button>`; };
  const postHtml = (p, hot) => {
    const list = p.comments || [], n = p.cn != null ? p.cn : list.length, isOpen = open.has(String(p.id));
    const panel = isOpen ? `<div class="cmts">
        ${n > list.length ? `<div class="cmtMore">이전 댓글 ${n-list.length}개는 생략돼요</div>` : ''}
        ${list.map(c => `<div class="cmt"><b>${esc(c.name)}</b>${esc(c.text)}<span>${esc(c.date)}</span>${c.id ? repBtn(p.id, c.id) : ''}</div>`).join('')}
        <div class="cmtForm"><input class="cmtIn" type="text" data-id="${esc(p.id)}" maxlength="150" placeholder="댓글을 남겨 보세요" autocomplete="off"><button class="cmtGo" data-id="${esc(p.id)}">등록</button></div>
      </div>` : '';
    return `<div class="story${hot?' hot':''}">
      <div class="who">${hot?'<span class="tag hotTag">🔥 인기글</span>':''}<span>${esc(p.name)}</span><span>· ${esc(p.date)}</span></div>
      <p>${esc(p.text).replace(/\n/g,'<br>')}</p>
      <div class="likeRow"><button class="like${p.liked?' on':''}" data-id="${esc(p.id)}" ${p.liked?'disabled':''}>${p.liked?'❤️':'🤍'} ${p.likes||0}</button><button class="cmtToggle" data-id="${esc(p.id)}">💬 댓글 ${n}</button>${repBtn(p.id)}</div>
      ${panel}
    </div>`;
  };
  const submitComment = id => {
    const inp = $('#mcard').querySelector('.cmtIn[data-id="'+id+'"]'); const v = inp ? inp.value.trim() : ''; if(!v) return;
    delete drafts[id]; inp.value = '';
    if(net.on) net.send({ t:'comment', b:b.id, id:Number(id), text:v }); /* 서버가 돌려주면 화면에 나타나요 */
    else { addCommentLocal(b, id, v); rerender(); }
  };
  const render = () => {
    const { popular, rest } = sortPosts(getPosts(b));
    $('#mcard').innerHTML = `
      <header><div class="ico" style="background:${b.roof};color:#fff">${b.emoji}</div><div><h2>${esc(b.name)}</h2><p>${esc(b.desc)}</p></div><button class="x" onclick="window.__close()">×</button></header>
      <div class="body">
        <div class="story example"><div class="who"><span class="tag">📌 예시</span><span>이런 식으로 남겨 보세요</span></div><p>${esc(b.example)}</p></div>
        ${popular.map(p => postHtml(p, true)).join('')}
        <h3>${esc(b.cta || '나도 한마디 남기기')}</h3>
        <textarea id="pt" maxlength="300" placeholder="${esc(b.ph || '이 분야에서 내가 해본 것, 궁금한 것, 도움이 된 정보를 남겨 주세요')}"></textarea>
        <div class="row"><button class="primary" id="ptGo">남기기</button></div>
        <p class="note">${b.notice ? '🔒 '+esc(b.notice)+'<br>' : ''}${net.on ? '남긴 글은 접속한 모두에게 보여요. 좋아요는 글마다 한 번만 누를 수 있어요.' : '지금은 오프라인이라 내 브라우저에만 저장돼요.'}</p>
        <div class="rules"><b>🙏 함께 지켜 주세요</b><ul>
          <li>부대 이름·위치, 훈련·장비 정보 같은 <b>군사 기밀</b>은 쓰지 마세요.</li>
          <li>실명, 전화번호, 계정 등 <b>개인정보</b>는 올리지 마세요. 로그인이 없어서 한번 올린 글은 모두가 볼 수 있어요.</li>
          <li>특정인을 향한 욕설·비방, 광고는 안 돼요. 부적절한 글은 🚩로 신고해 주세요.</li>
        </ul></div>
        ${rest.length ? '<h3>모든 글 (최신순)</h3>'+rest.map(p => postHtml(p, false)).join('') : ''}
      </div>`;
    $('#ptGo').onclick = () => {
      const v = $('#pt').value.trim(); if(!v) return;
      if(net.on){ net.send({ t:'post', b:b.id, text:v }); $('#pt').value=''; return; } /* 서버가 돌려주면 화면에 나타나요 */
      const key = 'hv_posts_'+b.id, arr = store.get(key, []);
      arr.push({ id:'l'+Date.now(), name: me.name, text: v, date: new Date().toLocaleDateString('ko-KR'), likes:0 });
      store.set(key, arr); rerender();
    };
    const card = $('#mcard');
    card.querySelectorAll('.like:not([disabled])').forEach(btn => { btn.onclick = () => { likePost(b, btn.dataset.id); if(!net.on) rerender(); }; });
    card.querySelectorAll('.cmtToggle').forEach(btn => { btn.onclick = () => { const id = btn.dataset.id; open.has(id) ? open.delete(id) : open.add(id); rerender(id); }; });
    card.querySelectorAll('.cmtGo').forEach(btn => { btn.onclick = () => submitComment(btn.dataset.id); });
    card.querySelectorAll('.rep:not([disabled])').forEach(btn => { btn.onclick = () => {
      if(!confirm(btn.dataset.cid ? '이 댓글을 신고할까요?' : '이 글을 신고할까요?')) return;
      const id = Number(btn.dataset.id), cid = btn.dataset.cid ? Number(btn.dataset.cid) : undefined;
      const list = store.get('hv_reported', []); list.push(b.id+':'+id+(cid?':'+cid:'')); store.set('hv_reported', list.slice(-300));
      net.send({ t:'report', b:b.id, id, cid }); rerender();
    }; });
    card.querySelectorAll('.cmtIn').forEach(inp => {
      inp.value = drafts[inp.dataset.id] || '';
      inp.addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); submitComment(inp.dataset.id); } });
    });
  };
  /* 새 글·좋아요·댓글이 오면 쓰던 글·댓글, 스크롤 위치, 입력 중이던 칸을 유지한 채 다시 그려요 */
  const rerender = focusId => {
    const card = $('#mcard'), d = $('#pt') ? $('#pt').value : '', top = card.scrollTop, af = document.activeElement;
    card.querySelectorAll('.cmtIn').forEach(i => { drafts[i.dataset.id] = i.value; });
    const keep = typeof focusId === 'string' ? focusId : (af && af.classList && af.classList.contains('cmtIn') ? af.dataset.id : null);
    render(); $('#pt').value = d; card.scrollTop = top;
    if(keep){ const i = card.querySelector('.cmtIn[data-id="'+keep+'"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  };
  net.rerender = id => { if(inModal && id===b.id) rerender(); };
  inModal = true; $('#modal').classList.add('show'); render();
}
})();
</script>
</body>
</html>
