<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>복귀마을 운영자</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:#f4efe2;color:#2a2f24;padding:16px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 12px}
  h2{font-size:15px;margin:22px 0 8px;color:#43502a}
  input,button{font:inherit}
  input{padding:9px 11px;border:1px solid #d6cdb4;border-radius:10px;background:#fff;min-width:0}
  button{border:0;border-radius:10px;padding:8px 13px;font-weight:700;background:#5d6b3a;color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:#2a2f24;border:1px solid #d6cdb4}
  button.del{background:#c4432b}
  button:disabled{opacity:.5}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .card{background:#fff;border:1px solid #d6cdb4;border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .card.flag{border-color:#e0572f;background:#fff4ef}
  .card.hid{opacity:.75;border-style:dashed}
  .meta{font-size:12px;color:#7a7a66;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
  .meta .b{background:#e8e1cd;border-radius:999px;padding:1px 8px}
  .meta .r{background:#e0572f;color:#fff;border-radius:999px;padding:1px 8px}
  .txt{white-space:pre-wrap;word-break:break-all;font-size:14px;line-height:1.5}
  .act{margin-top:6px;display:flex;gap:6px}
  .cm{margin:8px 0 0 12px;padding-left:10px;border-left:3px solid #e8e1cd}
  .msg{padding:8px 12px;border-radius:10px;background:#2a2f24;color:#fff;font-size:13px;margin:8px 0;display:none}
  #panel{display:none}
  .empty{color:#7a7a66;font-size:13px;padding:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 복귀마을 운영자</h1>
  <div class="bar" id="login">
    <input type="password" id="key" placeholder="운영자 비밀번호" autocomplete="current-password">
    <button id="go">들어가기</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="panel">
    <div class="bar">
      <button class="ghost" id="reload">🔄 새로고침</button>
      <button class="ghost" id="backup">💾 기록 전체 내려받기</button>
      <button class="ghost" id="out">나가기</button>
      <span id="counts" style="font-size:12px;color:#7a7a66"></span>
    </div>
    <p style="font-size:12.5px;color:#7a7a66;margin:0 0 4px">신고가 있거나 가려진 항목이 맨 위에 와요. 삭제는 되돌릴 수 없어요. 가려진 글은 "복구"로 다시 보이게 할 수 있어요.</p>
    <div id="stats"></div>
    <div id="flagged"></div>
    <div id="all"></div>
    <div id="chat"></div>
    <div id="pledges"></div>
  </div>
</div>
<script>
const NAMES = { job:'💼 취업관', cert:'📚 자격증 도서관', soon:'📅 전역 준비관', trip:'🧳 여행사', rest:'🍵 쉼터', story:'🔥 군대 썰방' };
const $ = s => document.querySelector(s);
let KEY = '';
try { KEY = sessionStorage.getItem('hv_adm') || ''; } catch (e) {}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function say(t, bad){ const m = $('#msg'); m.textContent = t; m.style.display = t ? 'block' : 'none'; m.style.background = bad ? '#c4432b' : '#2a2f24'; }
async function api(path, body){
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': KEY, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let e = {}; try { e = await r.json(); } catch (x) {} throw new Error(e.error || ('오류 ' + r.status)); }
  return r;
}
function card(kind, b, p, c){
  const it = c || p, flag = it.reports > 0 || it.hidden;
  const cls = 'card' + (flag ? ' flag' : '') + (it.hidden ? ' hid' : '');
  const data = `data-b="${b}" data-id="${p.id}"${c ? ` data-cid="${c.id}"` : ''}`;
  return `<div class="${cls}"><div class="meta"><span class="b">${c ? '댓글' : NAMES[b]}</span><b>${esc(it.name)}</b><span>${esc(it.date)}</span>${it.reports ? `<span class="r">신고 ${it.reports}</span>` : ''}${it.hidden ? '<span class="r">가려짐</span>' : ''}</div>
    <div class="txt">${esc(it.text)}</div>
    <div class="act">${it.hidden || it.reports ? `<button class="ghost" data-op="restore" ${data}>복구(신고 지우기)</button>` : ''}<button class="del" data-op="delete" ${data}>삭제</button></div></div>`;
}
async function load(){
  say('');
  try {
    const d = await (await api('/api/admin/list', {})).json();
    $('#login').style.display = 'none'; $('#panel').style.display = 'block';
    $('#counts').textContent = `글 ${d.counts.posts}개 · 다짐 ${d.counts.pledges}개 · 채팅 ${d.counts.chat}줄`;
    const flagged = [], all = [];
    for (const b of Object.keys(d.posts)) for (const p of d.posts[b]) {
      if (p.reports || p.hidden) flagged.push(card('p', b, p));
      p.comments.forEach(c => { if (c.reports || c.hidden) flagged.push(card('c', b, p, c)); });
      all.push(`<div>${card('p', b, p)}${p.comments.map(c => `<div class="cm">${card('c', b, p, c)}</div>`).join('')}</div>`);
    }
    const S = d.stats, fmtT = t => new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const dur = s => s >= 3600 ? Math.floor(s / 3600) + '시간 ' + Math.floor(s % 3600 / 60) + '분' : s >= 60 ? Math.floor(s / 60) + '분 ' + (s % 60) + '초' : s + '초';
    const tile = (n, l) => `<div style="flex:1 1 120px;background:#fff;border:1px solid #d6cdb4;border-radius:12px;padding:10px 12px"><div style="font-size:22px;font-weight:800;color:#43502a">${n}</div><div style="font-size:12px;color:#7a7a66">${l}</div></div>`;
    $('#stats').innerHTML = '<h2>📊 방문 현황</h2><div style="display:flex;gap:8px;flex-wrap:wrap">' + tile(S.today.v + '명', '오늘 방문자') + tile(S.today.n + '번', '오늘 접속 횟수') + tile(S.today.peak + '명', '오늘 최대 동시 접속') + tile(S.online.length + '명', '지금 접속 중') + tile(S.total + '명', '누적 방문자') + '</div>'
      + '<p style="font-size:12px;color:#7a7a66;margin:6px 0">방문자는 브라우저 기준이에요. 같은 사람이 다른 기기·브라우저로 오거나 저장 데이터를 지우면 따로 세어져요. 연결이 끊겼다 이어지면 접속 횟수가 늘어요. 날짜는 한국 시간 기준이에요.</p>'
      + '<h2>🟢 지금 접속 중</h2>' + (S.online.map(o => `<div class="card"><div class="meta"><b>${esc(o.name)}</b><span class="b">${esc(o.ip)}</span><span>${fmtT(o.since)}부터</span></div></div>`).join('') || '<div class="empty">아무도 없어요</div>')
      + '<h2>📅 하루별 방문(최근 14일)</h2><div class="card" style="padding:4px 12px"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:#7a7a66;text-align:left"><th style="padding:6px 0">날짜</th><th>방문자</th><th>접속 횟수</th><th>최대 동시</th></tr>'
      + (S.days.map(x => `<tr style="border-top:1px solid #eee6d0"><td style="padding:6px 0">${esc(x.d)}</td><td>${x.v}명</td><td>${x.n}번</td><td>${x.peak}명</td></tr>`).join('') || '<tr><td colspan="4" class="empty">아직 기록이 없어요</td></tr>') + '</table></div>'
      + '<h2>🚪 들어오고 나간 기록(최근 200건, 30일 보관)</h2>' + (S.visits.map(v => `<div class="card" style="padding:7px 12px"><div class="meta" style="margin:0"><span class="r" style="background:${v.ev === 'in' ? '#5d6b3a' : '#7a7a66'}">${v.ev === 'in' ? '입장' : '퇴장'}</span><b>${esc(v.name)}</b><span>${fmtT(v.t)}</span><span class="b">${esc(v.ip)}</span>${v.ev === 'out' ? `<span>머문 시간 ${dur(v.dur)}</span>` : ''}</div></div>`).join('') || '<div class="empty">아직 기록이 없어요</div>');
    $('#flagged').innerHTML = `<h2>🚩 신고·가려진 항목 (${flagged.length})</h2>` + (flagged.join('') || '<div class="empty">없어요</div>');
    $('#all').innerHTML = '<h2>📝 모든 글(건물별 최근 200개, 최신순)</h2>' + (all.join('') || '<div class="empty">아직 글이 없어요</div>');
    const fmt = t => new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    $('#chat').innerHTML = '<h2>💬 채팅 기록(최근 300줄, 최신순 · 30일 보관)</h2><p style="font-size:12px;color:#7a7a66;margin:0 0 6px">같은 괄호 번호는 같은 접속 주소에서 보낸 거예요. 이름은 누구나 바꿀 수 있어요.</p>' + (d.chat.map(c => `<div class="card"><div class="meta"><b>${esc(c.name)}</b><span>${fmt(c.t)}</span><span class="b">${esc(c.ip)}</span></div><div class="txt">${esc(c.text)}</div><div class="act"><button class="del" data-op="delchat" data-id="${c.id}">삭제</button></div></div>`).join('') || '<div class="empty">아직 채팅이 없어요</div>');
    $('#pledges').innerHTML = '<h2>🏮 오늘의 다짐(최근 100개)</h2>' + (d.pledges.map(p => `<div class="card"><div class="meta"><b>${esc(p.name)}</b></div><div class="txt">${esc(p.text)}</div><div class="act"><button class="del" data-op="delpledge" data-i="${p.i}" data-text="${esc(p.text)}">삭제</button></div></div>`).join('') || '<div class="empty">없어요</div>');
    try { sessionStorage.setItem('hv_adm', KEY); } catch (e) {}
  } catch (e) { say(e.message, true); if (!$('#panel').style.display || $('#panel').style.display === 'none') $('#login').style.display = 'flex'; }
}
$('#go').onclick = () => { KEY = $('#key').value; load(); };
$('#key').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#reload').onclick = load;
$('#out').onclick = () => { try { sessionStorage.removeItem('hv_adm'); } catch (e) {} KEY = ''; location.reload(); };
$('#backup').onclick = async () => {
  try { const r = await api('/api/admin/backup'); const blob = await r.blob(); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'homecoming-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); say('내려받았어요. 이 파일에는 좋아요 기록용 고유 번호가 들어 있으니 공개하지 마세요.'); }
  catch (e) { say(e.message, true); }
};
document.addEventListener('click', async e => {
  const t = e.target.closest('button[data-op]'); if (!t) return;
  const op = t.dataset.op;
  if (op === 'delete' && !confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
  t.disabled = true;
  try {
    const body = op === 'delchat' ? { id: Number(t.dataset.id) } : op === 'delpledge' ? { i: Number(t.dataset.i), text: t.dataset.text } : { b: t.dataset.b, id: Number(t.dataset.id), cid: t.dataset.cid ? Number(t.dataset.cid) : undefined };
    await api('/api/admin/' + op, body); await load();
  } catch (x) { say(x.message, true); t.disabled = false; }
});
if (KEY) load();
</script>
</body>
</html>
